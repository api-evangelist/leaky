name: Leaky
description: Leaky was a US auto-insurance comparison service that operated from 2011
  until 31 August 2013. It let consumers compare prices and plans across the nation's
  top insurers, model "what if" coverage scenarios, and keep all of their policy information
  in one place with alerts when they could save money. The comparison engine was built
  by reverse-engineering the pricing models of more than 100 insurers from publicly-available
  government filings rather than by selling user information to carriers. Leaky reported
  providing over $300 million of auto-insurance quotes and saving its users more than
  $40 million before it wound down the consumer business; its commercial-insurance
  business was acquired by Navion Insurance. The company was backed by 500 Global (500
  Startups). Leaky is defunct — leaky.com now serves only a static shutdown notice,
  all user data was deleted at closure, and there is no developer portal, public API,
  SDK, or discovery surface to catalog.
